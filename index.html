<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate FPS Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
    cursor:default;
}

canvas{
    display:block;
}

#menu{
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle,#111,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:20;
}

#menu h1{
    color:white;
    font-size:70px;
    margin-bottom:20px;
}

#menu p{
    color:#aaa;
    font-size:22px;
    margin-bottom:30px;
}

button{
    padding:15px 40px;
    font-size:28px;
    border:none;
    background:crimson;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:red;
    transform:scale(1.05);
}

#hud{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
    color:white;
}

#health,
#ammo,
#enemies,
#mission{
    position:absolute;
    left:20px;
    font-size:28px;
    text-shadow:0 0 10px black;
}

#health{top:20px;}
#ammo{top:60px;}
#enemies{top:100px;}
#mission{top:140px;}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:36px;
}

#hitmarker{
    position:absolute;
    left:50%;
    top:50%;
    width:25px;
    height:25px;
    border:3px solid white;
    transform:translate(-50%,-50%);
    opacity:0;
    transition:0.1s;
}

#damageOverlay{
    position:absolute;
    width:100%;
    height:100%;
    background:red;
    opacity:0;
    transition:0.15s;
    pointer-events:none;
}

#gameOverScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.96);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#gameOverText{
    font-size:90px;
    margin-bottom:30px;
    text-shadow:0 0 30px red;
}

</style>
</head>

<body>

<div id="menu">

    <h1>FPS STORY CAMPAIGN</h1>

    <p>
        WASD = Move |
        SHIFT = Sprint |
        SPACE = Jump |
        CLICK = Shoot
    </p>

    <button id="startBtn">
        START MISSION
    </button>

</div>

<div id="hud">

    <div id="health">
        Health: 100
    </div>

    <div id="ammo">
        Ammo: 30
    </div>

    <div id="enemies">
        Enemies: 10
    </div>

    <div id="mission">
        Mission: Eliminate All Enemies
    </div>

    <div id="crosshair">+</div>

    <div id="hitmarker"></div>

</div>

<div id="damageOverlay"></div>

<div id="gameOverScreen">

    <h1 id="gameOverText"></h1>

    <button onclick="location.reload()">
        RESTART
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let flashlight;

let bgMusic;
let gunshotSound;

let enemyList = [];
let medkits = [];
let buildings = [];

let keys = {};

let yaw = 0;
let pitch = 0;

let locked = false;

let velocityY = 0;
let grounded = true;

let gameEnded = false;

let mouseSensitivity = 0.005;

let normalSpeed = 0.35;
let sprintSpeed = 0.7;

let ammo = 30;

let player = {
    health:100
};

init();
animate();

function init(){
    bgMusic =
        new Audio("Beat It.mp3");
    bgMusic.loop = true;
    bgMusic.volume = 0.4;

    themeMusic =
        new Audio("God of War.mp3");
    themeMusic.loop = true;
    themeMusic.volume = 0.4;

    gunshotSound =
        new Audio("Gun.webm");
    gunshotSound.volume = 0.5;

    medkitSound =
        new Audio("coin.wav");

    medkitSound.volume = 1;

    damageSound =
        new Audio("Damage.mp3");

    damageSound.volume = 1;

    scene = new THREE.Scene();
    scene.background =
        new THREE.Color(0x050505);
    scene.fog =
        new THREE.Fog(
            0x111111,
            30,
            200
        );

    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );

    camera.position.set(0,2,5);

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );

    createLights();
    createFloor();
    createBuildings();
    createEnemies();
    createMedkits();

    setupControls();

    document
    .getElementById("startBtn")
    .onclick = startGame;

    window.addEventListener(
        "resize",
        onResize
    );

    // Play menu music immediately
    themeMusic.play().catch(()=>{});
}

function startGame(){
    themeMusic.pause();

    document.body.requestPointerLock();

    document.body.style.cursor =
        "none";

    locked = true;

    document
    .getElementById("menu")
    .style.display = "none";
}

function createLights(){

    const light =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    light.position.set(20,50,20);

    light.castShadow = true;

    scene.add(light);

    const ambient =
        new THREE.AmbientLight(
            0x223344,
            1
        );

    scene.add(ambient);

    flashlight =
        new THREE.SpotLight(
            0xffffff,
            5,
            100,
            Math.PI/8
        );

    flashlight.castShadow = true;

    scene.add(flashlight);
    scene.add(flashlight.target);
}

function createFloor(){

    const floor =
        new THREE.Mesh(

        new THREE.PlaneGeometry(
            300,
            300
        ),

        new THREE.MeshStandardMaterial({
            color:0x444444
        })
    );

    floor.rotation.x = -Math.PI/2;

    floor.receiveShadow = true;

    scene.add(floor);
}

function isPositionInsideBuilding(x,z){

    for(let building of buildings){

        const bx = building.position.x;
        const bz = building.position.z;

        if(
            x > bx - 7 &&
            x < bx + 7 &&
            z > bz - 7 &&
            z < bz + 7
        ){
            return true;
        }
    }

    return false;
}

function createBuildings(){

    for(let i=0;i<40;i++){

        const height =
            Math.random()*20+10;

        const building =
            new THREE.Mesh(

            new THREE.BoxGeometry(
                10,
                height,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x666666
            })
        );

        let valid = false;

        while(!valid){

            const x =
                Math.random()*250-125;

            const z =
                Math.random()*250-125;

            if(
                !isPositionInsideBuilding(x,z)
            ){

                building.position.set(
                    x,
                    height/2,
                    z
                );

                valid = true;
            }
        }

        building.castShadow = true;
        building.receiveShadow = true;

        scene.add(building);

        buildings.push(building);
    }
}

function createEnemies(){

    for(let i=0;i<10;i++){

        const enemy =
            new THREE.Group();

        const body =
            new THREE.Mesh(

            new THREE.BoxGeometry(
                1.8,
                2.3,
                1.2
            ),

            new THREE.MeshStandardMaterial({
                color:0x550000,
                metalness:0.4,
                roughness:0.3
            })
        );

        body.position.y = 1.5;

        const head =
            new THREE.Mesh(

            new THREE.SphereGeometry(
                0.6,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({
                color:0x883333
            })
        );

        head.position.y = 3.2;

        const eyeMaterial =
            new THREE.MeshBasicMaterial({
                color:0xff0000
            });

        const eye1 =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.08,
                    8,
                    8
                ),
                eyeMaterial
            );

        const eye2 =
            eye1.clone();

        eye1.position.set(
            -0.15,
            3.25,
            0.55
        );

        eye2.position.set(
            0.15,
            3.25,
            0.55
        );

        const sword =
            new THREE.Mesh(

            new THREE.BoxGeometry(
                0.15,
                2,
                0.15
            ),

            new THREE.MeshStandardMaterial({
                color:0xcccccc,
                metalness:1,
                roughness:0.2
            })
        );

        sword.position.set(
            1,
            1.7,
            0
        );

        sword.rotation.z =
            -0.4;

        const handle =
            new THREE.Mesh(

            new THREE.BoxGeometry(
                0.25,
                0.4,
                0.25
            ),

            new THREE.MeshStandardMaterial({
                color:0x222222
            })
        );

        handle.position.set(
            1,
            0.8,
            0
        );

        enemy.add(body);
        enemy.add(head);
        enemy.add(eye1);
        enemy.add(eye2);
        enemy.add(sword);
        enemy.add(handle);

        let valid = false;

        while(!valid){
        
            const x =
                Math.random()*220-110;
        
            const z =
                Math.random()*220-110;
        
            const distanceFromPlayer =
                Math.sqrt(
                    x*x + z*z
                );
        
            if(
                !isPositionInsideBuilding(x,z)
                &&
                distanceFromPlayer > 35
            ){
        
                enemy.position.set(
                    x,
                    0,
                    z
                );
        
                valid = true;
            }
        }

        enemy.health = 100;

        enemy.moveStyle =
            Math.random();

        scene.add(enemy);

        enemyList.push(enemy);
    }
}

function createMedkits(){

    for(let i=0;i<5;i++){

        const medkit =
            new THREE.Mesh(

            new THREE.BoxGeometry(
                1,
                1,
                1
            ),

            new THREE.MeshStandardMaterial({
                color:0xffffff,
                emissive:0x00ff00,
                emissiveIntensity:1
            })
        );

        let valid = false;

        while(!valid){

            const x =
                Math.random()*100-50;

            const z =
                Math.random()*100-50;

            if(
                !isPositionInsideBuilding(x,z)
            ){

                medkit.position.set(
                    x,
                    1,
                    z
                );

                valid = true;
            }
        }

        scene.add(medkit);

        medkits.push(medkit);
    }
}

function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{
            keys[e.code] = true;
        }
    );

    window.addEventListener(
        "keyup",
        e=>{
            keys[e.code] = false;
        }
    );

    window.addEventListener(
        "mousemove",
        e=>{

            if(!locked || gameEnded)
                return;

            yaw -=
                e.movementX
                * mouseSensitivity;

            pitch -=
                e.movementY
                * mouseSensitivity;

            pitch = Math.max(
                -Math.PI/2,
                Math.min(Math.PI/2,pitch)
            );

            camera.rotation.order =
                "YXZ";

            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }
    );

    window.addEventListener(
    "click",
    ()=>{

        // BLOCK clicks while menu is open
        if(
            document.getElementById("menu")
            .style.display !== "none"
        ){
            return;
        }

        if(gameEnded)
            return;

        if(!locked)
            return;

        shoot();
    }
);

    document.addEventListener(
        "pointerlockchange",
        ()=>{

            locked =
                document.pointerLockElement
                === document.body;

            if(!locked && !gameEnded){

                document
                .getElementById("menu")
                .style.display = "flex";

                bgMusic.pause();

                document.body.style.cursor =
                    "default";

            } else if(!gameEnded){

                bgMusic.play();
            }
        }
    );
}

function collidesWithWall(position){

    for(let building of buildings){

        if(
            position.x >
            building.position.x - 6 &&
            position.x <
            building.position.x + 6 &&
            position.z >
            building.position.z - 6 &&
            position.z <
            building.position.z + 6
        ){
            return true;
        }
    }

    return false;
}

function movePlayer(){

    if(gameEnded) return;

    const speed =
        keys["ShiftLeft"]
        ? sprintSpeed
        : normalSpeed;

    const forward =
        new THREE.Vector3();

    camera.getWorldDirection(forward);

    forward.y = 0;

    forward.normalize();

    const right =
        new THREE.Vector3();

    right.crossVectors(
        forward,
        new THREE.Vector3(0,1,0)
    );

    const newPosition =
        camera.position.clone();

    if(keys["KeyW"]){

        newPosition.add(
            forward.clone()
            .multiplyScalar(speed)
        );
    }

    if(keys["KeyS"]){

        newPosition.add(
            forward.clone()
            .multiplyScalar(-speed)
        );
    }

    if(keys["KeyA"]){

        newPosition.add(
            right.clone()
            .multiplyScalar(-speed)
        );
    }

    if(keys["KeyD"]){

        newPosition.add(
            right.clone()
            .multiplyScalar(speed)
        );
    }

    if(!collidesWithWall(newPosition)){

        camera.position.x =
            newPosition.x;

        camera.position.z =
            newPosition.z;
    }

    if(keys["Space"] && grounded){

        velocityY = 0.2;

        grounded = false;
    }

    velocityY -= 0.01;

    camera.position.y += velocityY;

    if(camera.position.y < 2){

        camera.position.y = 2;

        velocityY = 0;

        grounded = true;
    }
}

let canShoot = true;

function shoot(){

    if(gameEnded) return;

    // SHOOT COOLDOWN
    if(!canShoot)
        return;

    if(ammo <= 0)
        return;

    canShoot = false;

    setTimeout(()=>{

        canShoot = true;

    },1000);

    ammo--;

    gunshotSound.currentTime = 0;
    gunshotSound.play();

    camera.rotation.x -= 0.03;

    const flash =
        new THREE.PointLight(
            0xffaa55,
            4,
            20
        );

    flash.position.copy(
        camera.position
    );

    scene.add(flash);

    setTimeout(()=>{
        scene.remove(flash);
    },50);

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits =
        raycaster.intersectObjects(
            enemyList,
            true
        );

    if(hits.length > 0){

        const marker =
            document.getElementById(
                "hitmarker"
            );

        marker.style.opacity = 1;

        setTimeout(()=>{
            marker.style.opacity = 0;
        },100);

        let enemyGroup =
            hits[0].object.parent;

        enemyGroup.health -= 50;

        if(enemyGroup.health <= 0){

            enemyGroup.rotation.z =
                Math.PI/2;

            setTimeout(()=>{

                scene.remove(enemyGroup);

                enemyList =
                    enemyList.filter(
                        e=>e!==enemyGroup
                    );

            },500);
        }
    }
}

function updateEnemies(){

    if(gameEnded) return;

    enemyList.forEach(enemy=>{

        const direction =
            new THREE.Vector3();

        direction.subVectors(
            camera.position,
            enemy.position
        );

        enemy.position.y = 0;

        const distance =
            direction.length();

        enemy.lookAt(camera.position);

        const sword =
            enemy.children[4];

        if(distance < 5){

            player.health -= 0.25;

            if(Math.random() < 0.03){
                damageSound.currentTime = 0;
                damageSound.play();
            } 
        }
        else {

            sword.rotation.z = -0.4;
        }

        // RANDOMIZED MOVEMENT
        if(
            distance > 4 &&
            (
                enemy.moveStyle > 0.4 ||
                distance < 25
            )
        ){

            direction.normalize();

            const nextPosition =
                enemy.position.clone();

            nextPosition.add(
                direction.multiplyScalar(0.09)
            );

            if(
                !collidesWithWall(nextPosition)
            ){

                enemy.position.copy(
                    nextPosition
                );
            }
        }

        if(distance < 5){

            player.health -= 0.25;

            dramaticDamageEffect();

            camera.position.x +=
                (Math.random()-0.5)
                * 0.08;

            camera.position.y +=
                (Math.random()-0.5)
                * 0.05;
        }
    });
}

function dramaticDamageEffect(){

    const overlay =
        document.getElementById(
            "damageOverlay"
        );

    overlay.style.opacity = 0.35;

    camera.rotation.z =
        Math.sin(Date.now()*0.05)
        * 0.03;

    setTimeout(()=>{

        overlay.style.opacity = 0;

        camera.rotation.z = 0;

    },120);
}

function updateMedkits(){

    medkits.forEach(medkit=>{

        if(
            camera.position.distanceTo(
                medkit.position
            ) < 2
        ){

            player.health =
                Math.min(
                    100,
                    player.health + 40
                );

            ammo += 1;

            medkitSound.currentTime = 0;
            medkitSound.play();

            scene.remove(medkit);

            medkits =
                medkits.filter(
                    m=>m!==medkit
                );
        }
    });
}

function updateFlashlight(){

    flashlight.position.copy(
        camera.position
    );

    const dir =
        new THREE.Vector3();

    camera.getWorldDirection(dir);

    flashlight.target.position.copy(
        camera.position
        .clone()
        .add(dir)
    );
}

function updateHUD(){

    document
    .getElementById("health")
    .innerText =
    "Health: " +
    Math.max(
        0,
        Math.floor(player.health)
    );

    document
    .getElementById("ammo")
    .innerText =
    "Ammo: " + ammo;

    document
    .getElementById("enemies")
    .innerText =
    "Enemies: "
    + enemyList.length;

    if(enemyList.length === 0){

        endGame(true);
    }

    if(player.health <= 0){

        endGame(false);
    }
}

function endGame(win){
    themeMusic.play().catch(()=>{});

    if(gameEnded) return;

    gameEnded = true;

    bgMusic.pause();

    locked = false;

    document.exitPointerLock();

    document.body.style.cursor =
        "default";

    document
    .getElementById("mission")
    .innerText =
    win
    ? "Extraction Incoming..."
    : "You Have Fallen...";

    setTimeout(()=>{

        const screen =
            document.getElementById(
                "gameOverScreen"
            );

        const text =
            document.getElementById(
                "gameOverText"
            );

        screen.style.display =
            "flex";

        if(win){

            text.innerText =
                "MISSION COMPLETE";

            text.style.color =
                "#00ff88";

        } else {

            text.innerText =
                "MISSION FAILED";

            text.style.color =
                "#ff3333";
        }

    },3000);
}

function animate(){

    requestAnimationFrame(
        animate
    );

    movePlayer();

    updateEnemies();

    updateMedkits();

    updateFlashlight();

    updateHUD();

    medkits.forEach(medkit=>{

        medkit.rotation.y += 0.03;

        medkit.position.y =
            1 +
            Math.sin(
                Date.now()*0.003
            ) * 0.3;
    });

    renderer.render(
        scene,
        camera
    );
}

function onResize(){

    camera.aspect =
        window.innerWidth
        / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

</script>

</body>
</html>
